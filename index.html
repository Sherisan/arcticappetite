<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Worldiator — Arctic Appetite</title>
    <style>
      /* Boot splash — visible while the JS bundle downloads; SplashScreen.tsx removes it. */
      html, body { margin: 0; height: 100%; background: #03101c; }
      #boot-splash {
        position: fixed; inset: 0; z-index: 100;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background:
          radial-gradient(ellipse at 50% 30%, rgba(0, 245, 255, 0.14), transparent 60%),
          linear-gradient(180deg, #2a7fae 0%, #0b2f4d 55%, #03101c 100%);
        font-family: system-ui, sans-serif; text-align: center;
      }
      #boot-splash img { width: min(520px, 82vw); height: auto; }
      #boot-splash .bar {
        width: min(280px, 70vw); height: 8px; border-radius: 999px; overflow: hidden;
        background: rgba(5, 25, 51, 0.8); border: 1px solid #1a4b75;
      }
      #boot-splash .bar i {
        display: block; height: 100%; border-radius: inherit;
        background: linear-gradient(90deg, #00f5ff, #ffd700);
        animation: bootfill 6s ease-out forwards;
      }
      @keyframes bootfill { from { width: 2%; } to { width: 14%; } }
      #boot-splash p { margin: 0; color: #a1c4e6; font-size: 14px; letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status">
      <img src="/logo.svg" alt="Arctic Appetite" />
      <div class="bar"><i></i></div>
      <p>Loading…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
